name: vacation 배포 (Cloudflare)

# vacation/ 폴더가 main 에 반영되면 Cloudflare Workers 로 배포합니다.
on:
  push:
    branches: [main]
    paths:
      - 'vacation/**'
      - '.github/workflows/vacation-deploy.yml'
  workflow_dispatch:

concurrency:
  group: vacation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다. vacation/DEPLOY.md 참고."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_WITH_HYPERDRIVE_ID wrangler.jsonc; then
            echo "::notice::wrangler.jsonc 의 Hyperdrive id 가 아직 설정되지 않아 배포를 건너뜁니다. vacation/DEPLOY.md 참고."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vacation/package-lock.json

      - name: 설치
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: 테스트
        if: steps.check.outputs.ready == 'true'
        run: npm test

      - name: 배포
        if: steps.check.outputs.ready == 'true'
        run: npm run deploy
