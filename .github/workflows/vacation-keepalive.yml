name: vacation 상태 확인 (Supabase 정지 방지)

# Supabase 무료 프로젝트는 일주일간 DB 사용이 적으면 일시 정지됩니다.
# 주 2회 상태 확인 주소를 호출해 DB 를 한 번씩 조회합니다. 실패하면 이 워크플로우가 실패로 표시되고 GitHub 알림 메일이 옵니다.
on:
  schedule:
    - cron: '17 0 * * 1,4' # 월·목 09:17 (한국 시간)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 상태 확인 호출
        env:
          VACATION_URL: ${{ vars.VACATION_URL }}
        run: |
          if [ -z "$VACATION_URL" ]; then
            echo "::notice::저장소 변수 VACATION_URL 이 없어 건너뜁니다. vacation/DEPLOY.md 참고."
            exit 0
          fi
          for i in 1 2 3; do
            body=$(curl -sS --max-time 30 "${VACATION_URL%/}/api/health" || true)
            echo "응답: $body"
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 20
          done
          echo "::error::상태 확인 실패. Supabase 프로젝트가 정지됐거나 사이트에 문제가 있습니다."
          exit 1
