<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dancing With the Wind</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas#c { width: 100%; height: 100%; display: block; background: #000; cursor: pointer; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.12); opacity: 0; transition: opacity .4s; }
  #bar > i { display: block; height: 100%; width: 0; background: rgba(255,226,170,0.8); }
  #stage:hover #bar { opacity: 1; }
  #play { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: rgba(0,0,0,0.35); border: 2px solid rgba(255,236,200,0.75); cursor: pointer; display: none; padding: 0; }
  #play::after { content: ""; position: absolute; left: 46px; top: 34px; border-style: solid; border-width: 26px 0 26px 42px;
    border-color: transparent transparent transparent rgba(255,236,200,0.9); }
  #play:hover { background: rgba(0,0,0,0.5); }
  #load { position: absolute; left: 35%; right: 35%; top: 50%; height: 3px; background: rgba(255,255,255,0.15); }
  #load > i { display: block; height: 100%; width: 0; background: rgba(255,226,170,0.85); transition: width .2s; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="bar"><i></i></div><div id="load"><i></i></div><button id="play" aria-label="Play"></button></div>
<script>
'use strict';
/* ===================== core ===================== */
const W = 1920, H = 1080, FPS = 24, DUR = 91, NF = DUR * FPS;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function RNG(seed) {
  const r = mulberry32(seed >>> 0);
  r.range = (a, b) => a + (b - a) * r();
  r.int = (a, b) => a + Math.floor((b - a + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.sign = () => (r() < 0.5 ? -1 : 1);
  return r;
}
function hash1(n) {
  n = Math.imul(n | 0, 374761393) ^ 0x9E3779B9;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function hash2(a, b) { return hash1(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663)); }
function hash3(a, b, c) { return hash1(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663) ^ Math.imul(c | 0, 83492791)); }

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const E = {
  inS: (t) => 1 - Math.cos((t * Math.PI) / 2),
  outS: (t) => Math.sin((t * Math.PI) / 2),
  io: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  ioC: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outC: (t) => 1 - Math.pow(1 - t, 3),
  inC: (t) => t * t * t,
  outQ: (t) => 1 - (1 - t) * (1 - t),
  inQ: (t) => t * t,
};
function noise1(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  const a = hash2(i, seed), b = hash2(i + 1, seed);
  const u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
}
function fbm1(x, seed = 0) {
  return noise1(x, seed) * 0.55 + noise1(x * 2.13, seed + 7) * 0.3 + noise1(x * 4.37, seed + 13) * 0.15;
}
/* wind gust strength 0..1 as a pure function of time (shared by picture and sound) */
function gust(t) { return clamp(0.25 + 0.95 * (fbm1(t * 0.55, 991) - 0.3)); }

/* ---------- colour ---------- */
function hx(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function c8(v) { return v < 0 ? 0 : v > 255 ? 255 : Math.round(v); }
function css(c, a = 1) { return 'rgba(' + c8(c[0]) + ',' + c8(c[1]) + ',' + c8(c[2]) + ',' + (a < 0 ? 0 : a > 1 ? 1 : +a.toFixed(4)) + ')'; }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function mul(a, b) { return [(a[0] * b[0]) / 255, (a[1] * b[1]) / 255, (a[2] * b[2]) / 255]; }
function scl(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
function addc(a, b, k = 1) { return [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k]; }
function jitc(c, r, a) { return [c[0] + (r() - 0.5) * a, c[1] + (r() - 0.5) * a, c[2] + (r() - 0.5) * a]; }
function lum(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
function desat(c, k) { const l = lum(c) * 255; return mix(c, [l, l, l], k); }

/* ---------- canvas ---------- */
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); return [c, x]; }

/* Catmull-Rom through points; a point [x,y,1] is a sharp corner */
function crPath(pts, closed = true, t = 1 / 6, path) {
  path = path || new Path2D();
  const n = pts.length;
  const g = (i) => (closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
  const tan = (i) => {
    const p = g(i);
    if (p[2] === 1 || (!closed && (i === 0 || i === n - 1))) return [0, 0];
    const a = g(i - 1), b = g(i + 1);
    return [(b[0] - a[0]) * t, (b[1] - a[1]) * t];
  };
  path.moveTo(pts[0][0], pts[0][1]);
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p1 = g(i), p2 = g(i + 1), t1 = tan(i), t2 = tan(i + 1);
    path.bezierCurveTo(p1[0] + t1[0], p1[1] + t1[1], p2[0] - t2[0], p2[1] - t2[1], p2[0], p2[1]);
  }
  if (closed) path.closePath();
  return path;
}
function polyPath(pts, closed = true, path) {
  path = path || new Path2D();
  path.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]);
  if (closed) path.closePath();
  return path;
}
function ellPath(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); return p; }
function tpts(pts, dx, dy, s = 1) { return pts.map((p) => [p[0] * s + dx, p[1] * s + dy, p[2]]); }

/* cel fill: base colour, shadow on the side away from the light offset (lx,ly) */
function celFill(ctx, path, base, shadow, lx, ly) {
  ctx.fillStyle = css(base); ctx.fill(path);
  if (!shadow) return;
  ctx.save(); ctx.clip(path);
  ctx.fillStyle = css(shadow); ctx.fill(path);
  ctx.translate(lx, ly); ctx.fillStyle = css(base); ctx.fill(path);
  ctx.restore();
}
function ink(ctx, path, col, w, a = 1) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = css(col, a); ctx.lineWidth = w; ctx.stroke(path);
}
function fillP(ctx, path, col, a = 1) { ctx.fillStyle = css(col, a); ctx.fill(path); }
/* fill then clip-paint a shadow shape inside */
function shadeIn(ctx, clipPath, shadePath, col, a = 1) {
  ctx.save(); ctx.clip(clipPath); ctx.fillStyle = css(col, a); ctx.fill(shadePath); ctx.restore();
}
/* two-bone IK; dir = +1/-1 chooses the bend side */
function ik2(hx_, hy, fx, fy, a, b, dir) {
  const dx = fx - hx_, dy = fy - hy;
  let d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(a - b) + 0.01, a + b - 0.01);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const k = ang - dir * A;
  return [hx_ + Math.cos(k) * a, hy + Math.sin(k) * a];
}
/* tapered limb outline between two points (capsule) */
function limbPath(x1, y1, x2, y2, w1, w2, path) {
  path = path || new Path2D();
  const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a);
  path.moveTo(x1 + nx * w1, y1 + ny * w1);
  path.lineTo(x2 + nx * w2, y2 + ny * w2);
  path.arc(x2, y2, w2, a + Math.PI / 2, a - Math.PI / 2, true);
  path.lineTo(x1 - nx * w1, y1 - ny * w1);
  path.arc(x1, y1, w1, a - Math.PI / 2, a + Math.PI / 2, true);
  path.closePath();
  return path;
}

/* ===================== painting primitives ===================== */
function soft(ctx, x, y, r, c, a, inner = 0) {
  if (r <= 0.5 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * inner, x, y, r);
  g.addColorStop(0, css(c, a)); g.addColorStop(1, css(c, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function softE(ctx, x, y, rx, ry, c, a, inner = 0) {
  if (rx <= 0.5 || ry <= 0.5) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); soft(ctx, 0, 0, rx, c, a, inner); ctx.restore();
}
function glow(ctx, x, y, r, c, a, inner = 0) {
  const o = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter';
  soft(ctx, x, y, r, c, a, inner); ctx.globalCompositeOperation = o;
}
function lg(ctx, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) g.addColorStop(s[0], css(s[1], s[2] == null ? 1 : s[2]));
  return g;
}
function vfill(ctx, x, y, w, h, stops) { ctx.fillStyle = lg(ctx, 0, y, 0, y + h, stops); ctx.fillRect(x, y, w, h); }

/* gouache / brush texture inside the current clip */
function gouache(ctx, r, x, y, w, h, base, o = {}) {
  const n = o.n ?? 300, s0 = o.s0 ?? 3, s1 = o.s1 ?? 18, j = o.j ?? 14;
  const a0 = o.a0 ?? 0.05, a1 = o.a1 ?? 0.14, st = o.st ?? 2.6, ang = o.ang ?? 0, aj = o.aj ?? 0.35;
  const colFn = o.colFn;
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + r() * h;
    const rad = lerp(s0, s1, r() * r());
    const c = colFn ? colFn(px, py, r) : base;
    ctx.fillStyle = css(jitc(c, r, j), lerp(a0, a1, r()));
    ctx.beginPath(); ctx.ellipse(px, py, rad * st, rad, ang + (r() - 0.5) * aj, 0, TAU); ctx.fill();
  }
}
/* dry brush streaks */
function streaks(ctx, r, x, y, w, h, base, o = {}) {
  const n = o.n ?? 80, len0 = o.l0 ?? 20, len1 = o.l1 ?? 90, wd = o.w ?? 1.5, ang = o.ang ?? 0, a = o.a ?? 0.1, j = o.j ?? 20;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + r() * h, L = lerp(len0, len1, r()), an = ang + (r() - 0.5) * 0.15;
    ctx.strokeStyle = css(jitc(base, r, j), a * (0.4 + r() * 0.8));
    ctx.lineWidth = wd * (0.5 + r());
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(an) * L, py + Math.sin(an) * L); ctx.stroke();
  }
}

/* Ghibli style cumulus: several overlapping lobes, flat bottoms, crisp lit edges */
function cloud(ctx, r, cx, cy, w, h, o) {
  const Lr = o.light || [0.25, -1], ln = Math.hypot(Lr[0], Lr[1]), L = [Lr[0] / ln, Lr[1] / ln];
  const lobes = o.lobes ?? Math.max(3, Math.round(w / 170));
  const list = [];
  for (let i = 0; i < lobes; i++) {
    const u = (i + 0.5) / lobes - 0.5 + (r() - 0.5) * 0.1;
    const prof = Math.pow(Math.max(0, 1 - 4 * u * u), 0.6);
    list.push({ x: cx + u * w, base: cy + h * 0.5 - r() * h * 0.06, w: (w / lobes) * (1.25 + r() * 0.5), h: h * (0.4 + 0.6 * prof) * (0.8 + r() * 0.3), depth: r() });
  }
  for (let i = 0; i < Math.max(1, lobes >> 1); i++) {
    const u = (r() - 0.5) * 0.5;
    list.push({ x: cx + u * w, base: cy + h * 0.5 - h * (0.25 + r() * 0.2), w: (w / lobes) * (1.3 + r() * 0.6), h: h * (0.55 + r() * 0.35), depth: -1 + r() * 0.5 });
  }
  list.sort((a, b) => a.depth - b.depth);
  if (o.haze) for (const lb of list) softE(ctx, lb.x, lb.base - lb.h * 0.4, lb.w * 0.8, lb.h * 0.8, o.haze, 0.07);
  for (const lb of list) drawLobe(ctx, r, lb, o, L);
}
function drawLobe(ctx, r, lb, o, L) {
  const puffs = [];
  const n = 6 + Math.floor(lb.w / 45);
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), ang = Math.PI * (1 - u);
    const rad = lb.h * (0.16 + 0.2 * Math.sin(ang)) * (0.7 + r() * 0.6);
    puffs.push([lb.x + Math.cos(ang) * lb.w * 0.5, lb.base - Math.sin(ang) * lb.h * 0.72 + rad * 0.45, rad]);
  }
  for (let i = 0; i < n; i++) puffs.push([lb.x + (r() - 0.5) * lb.w * 0.7, lb.base - r() * lb.h * 0.45, lb.h * (0.24 + r() * 0.2)]);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9;
  for (const p of puffs) { x0 = Math.min(x0, p[0] - p[2]); x1 = Math.max(x1, p[0] + p[2]); y0 = Math.min(y0, p[1] - p[2]); }
  const pad = 4, bw = Math.ceil(x1 - x0 + pad * 2), bh = Math.ceil(lb.base - y0 + pad * 2);
  if (bw < 4 || bh < 4) return;
  const ox = x0 - pad, oy = y0 - pad;
  const sil = new Path2D();
  for (const p of puffs) { sil.moveTo(p[0] - ox + p[2], p[1] - oy); sil.arc(p[0] - ox, p[1] - oy, p[2], 0, TAU); }
  const [c, x] = mkC(bw, bh);
  x.beginPath(); x.rect(0, 0, bw, lb.base - oy); x.clip();
  x.fillStyle = css(o.mid); x.fill(sil);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = lg(x, 0, lb.base - oy - lb.h * 0.55, 0, lb.base - oy, [[0, o.dark, 0], [1, o.dark, 1]]); x.fillRect(0, 0, bw, bh);
  const avg = lb.h * 0.3;
  const band = (col, d, a) => {
    const [bc, bx] = mkC(bw, bh);
    bx.fillStyle = css(col); bx.fill(sil);
    bx.globalCompositeOperation = 'destination-out'; bx.translate(-L[0] * d, -L[1] * d); bx.fill(sil);
    x.globalAlpha = a; x.drawImage(bc, 0, 0); x.globalAlpha = 1;
  };
  band(mix(o.mid, o.lit, 0.5), avg * 0.75, 0.8);
  band(o.lit, avg * 0.42, 0.95);
  if (o.hi) band(o.hi, avg * 0.13, 0.9);
  for (let i = 0; i < 6; i++) { const p = puffs[Math.floor(r() * n)]; soft(x, p[0] - ox + L[0] * p[2] * 0.4, p[1] - oy + L[1] * p[2] * 0.4, p[2] * 0.9, o.lit, 0.18); }
  gouache(x, r, 0, 0, bw, bh, o.mid, { n: Math.round(bw * bh / 1400), s0: 2, s1: Math.max(3, lb.h * 0.06), j: 20, a0: 0.03, a1: 0.09 });
  if (o.rim) band(o.rim, 2.5, 0.6);
  ctx.drawImage(c, ox, oy);
}

function stars(ctx, r, x, y, w, h, n, col, fadeY) {
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + Math.pow(r(), 1.6) * h;
    const fade = fadeY ? 1 - inv(y, y + fadeY, py) * 0.9 : 1;
    const s = r(); const rad = s < 0.92 ? 0.6 + r() * 0.9 : 1.4 + r() * 1.4;
    ctx.fillStyle = css(jitc(col, r, 40), (0.35 + r() * 0.65) * fade);
    ctx.beginPath(); ctx.arc(px, py, rad, 0, TAU); ctx.fill();
    if (s > 0.97) soft(ctx, px, py, rad * 6, col, 0.25 * fade);
  }
}

function moon(ctx, x, y, rad, col = [252, 246, 222], halo = [190, 205, 255]) {
  soft(ctx, x, y, rad * 9, halo, 0.10);
  soft(ctx, x, y, rad * 3.5, halo, 0.22);
  soft(ctx, x, y, rad * 1.7, col, 0.5);
  ctx.fillStyle = css(col); ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  const r = RNG(77);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.clip();
  for (let i = 0; i < 9; i++) softE(ctx, x + (r() - 0.5) * rad * 1.3, y + (r() - 0.5) * rad * 1.3, rad * (0.2 + r() * 0.35), rad * (0.15 + r() * 0.3), [205, 200, 185], 0.35);
  ctx.restore();
}

/* film grain tiles + vignette, created once */
const POST = {};
function initPost() {
  POST.grain = [];
  for (let k = 0; k < 6; k++) {
    const [c, x] = mkC(256, 256); const img = x.createImageData(256, 256); const r = RNG(5000 + k);
    for (let i = 0; i < 256 * 256; i++) {
      const v = 128 + ((r() + r() + r() - 1.5) * 70);
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = c8(v); img.data[i * 4 + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    POST.grain.push(c);
  }
  const [v, vx] = mkC(W, H);
  vx.fillStyle = '#fff'; vx.fillRect(0, 0, W, H);
  const g = vx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(70,55,60,0.75)');
  vx.fillStyle = g; vx.fillRect(0, 0, W, H);
  POST.vig = v;
}
function postFX(ctx, f, o = {}) {
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = o.vig ?? 0.55; ctx.drawImage(POST.vig, 0, 0);
  ctx.globalAlpha = o.grain ?? 0.09; ctx.globalCompositeOperation = 'overlay';
  const tile = POST.grain[f % POST.grain.length];
  const pat = ctx.createPattern(tile, 'repeat');
  const ox = Math.floor(hash1(f * 3 + 1) * 256), oy = Math.floor(hash1(f * 7 + 5) * 256);
  ctx.translate(-ox, -oy); ctx.fillStyle = pat; ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

/* ===================== character palettes ===================== */
const LINE = [52, 34, 32];
const PAL_BASE = {
  line: LINE, lineSoft: [120, 72, 62],
  skin: [246, 218, 196], skinS: [222, 168, 148], skinD: [196, 136, 120], blush: [240, 150, 140],
  eyeW: [252, 250, 246], iris: [44, 34, 34], irisL: [96, 70, 62], mouth: [168, 92, 84],
  coat: [74, 78, 90], coatS: [50, 52, 64], coatH: [104, 110, 126], lining: [58, 46, 50],
  shirt: [240, 242, 242], shirtS: [182, 190, 204],
  pants: [42, 42, 50], pantsS: [27, 27, 33], shoe: [38, 30, 28], shoeH: [80, 66, 60],
};
/* hair by age 0 (20s) .. 1 (70s) */
function hairCols(age) {
  const k = [
    [0.0, [36, 32, 42], [20, 18, 26], [78, 76, 96]],
    [0.3, [46, 44, 52], [26, 25, 32], [96, 96, 110]],
    [0.5, [104, 102, 110], [70, 70, 80], [160, 160, 170]],
    [0.7, [170, 170, 176], [124, 124, 136], [215, 215, 222]],
    [1.0, [226, 226, 228], [176, 176, 188], [248, 248, 250]],
  ];
  for (let i = 0; i < k.length - 1; i++) {
    if (age <= k[i + 1][0]) {
      const u = inv(k[i][0], k[i + 1][0], age);
      return [mix(k[i][1], k[i + 1][1], u), mix(k[i][2], k[i + 1][2], u), mix(k[i][3], k[i + 1][3], u)];
    }
  }
  return [k[4][1], k[4][2], k[4][3]];
}
/* palette for a lighting situation: tint multiplies, add lifts, lineK darkens lines less than fills */
function makePal(age, tint = [255, 255, 255], add = [0, 0, 0], extra = {}) {
  const p = {};
  const base = Object.assign({}, PAL_BASE, extra);
  const [h, hs, hh] = hairCols(age);

}

/* ===================== 3/4 close-up head (faces screen-left) =====================

function eyeQ(ctx, P, lw, e) {
  const { x, y, w, near } = e;
  const open = clamp(e.open);
  const hh = (near ? 13 : 11) * open;
  const ix = x - w / 2, ox = x + w / 2;
  const up = near ? [[ix, y + 2, 1], [x - w * 0.05, y - hh - 1], [ox, y - 1, 1]] : [[ox + 2, y + 2, 1], [x + w * 0.1, y - hh], [ix - 2, y - 2, 1]];
  const lo = near ? [[ox - 3, y + 2], [x, y + 3 + hh * 0.55], [ix + 2, y + 3]] : [[ix, y + 1], [x, y + 2 + hh * 0.5], [ox, y + 3]];
  if (open > 0.08) {
    const eyeP = crPath([...up, ...lo]);
    fillP(ctx, eyeP, P.eyeW);
    ctx.save(); ctx.clip(eyeP);
    const lk = e.look;
    const icx = x + lk[0] * w * 0.22 + (near ? -2 : -1), icy = y + 1 + lk[1] * 6;
    const irx = near ? 10.5 : 6.5, iry = 13;
    fillP(ctx, ellPath(icx, icy, irx, iry), P.iris);
    softE(ctx, icx, icy + 5, irx * 0.8, iry * 0.5, P.irisL, 0.55);
    fillP(ctx, ellPath(icx, icy - 1, irx * 0.48, iry * 0.48), scl(P.iris, 0.5));
    fillP(ctx, ellPath(icx - irx * 0.35, icy - iry * 0.42, near ? 3.2 : 2.2, near ? 3.6 : 2.6), [255, 255, 255]);
    fillP(ctx, ellPath(icx + irx * 0.3, icy + iry * 0.35, 1.4, 1.4), [255, 255, 255], 0.8);
    // lid shadow on the eye white
    fillP(ctx, crPath([[ix - 4, y - 20], [ox + 4, y - 20], [ox + 4, y - hh + 3], [x, y - hh + 5], [ix - 4, y - hh + 4]]), P.skinS, 0.35);
    ctx.restore();
  }
  // upper lid line, thick
  const lid = crPath(up, false);
  ink(ctx, lid, P.line, lw * (near ? 1.9 : 1.6));
  if (open > 0.08) {
    const low = crPath(near ? [[ox - 6, y + 4], [x - 4, y + 4 + hh * 0.55]] : [[ix + 2, y + 3], [x + 2, y + 3 + hh * 0.5]], false);
    ink(ctx, low, P.lineSoft, lw * 0.7);
  }
  // crease
  if (near) {
    const cr = new Path2D(); cr.moveTo(ix + 6, y - hh - 6); cr.quadraticCurveTo(x, y - hh - 10 - (1 - open) * 2, ox - 4, y - hh - 4);
    ink(ctx, cr, P.lineSoft, lw * 0.55, 0.8);
  }
}

/* hair clump: rootA -> bulge -> sharp tip -> bulge -> rootB */
function clump(a, b, tip, bulge = 10, bend = 0) {
  const ax = tip[0] - (a[0] + b[0]) / 2, ay = tip[1] - (a[1] + b[1]) / 2, len = Math.hypot(ax, ay) || 1;
  const nx = -ay / len, ny = ax / len;
  const m1 = [lerp(a[0], tip[0], 0.5) + nx * (bulge + bend), lerp(a[1], tip[1], 0.5) + ny * (bulge + bend)];
  const m2 = [lerp(b[0], tip[0], 0.5) - nx * (bulge - bend), lerp(b[1], tip[1], 0.5) - ny * (bulge - bend)];
  return crPath([[a[0], a[1]], m1, [tip[0], tip[1], 1], m2, [b[0], b[1]]]);
}
function drawHairQ(ctx, P, lw, t, wind, age, seed) {

  const old = thin > 0.5;

    [-60, -40], [-74, -80], [-56, -120], [-14, -150], [40, -156],
    [112 + w(1, 6), -176 + w(2, 8), 1], [96, -134],
    [150 + w(3, 8), -126 + w(4, 9), 1], [112, -98],
    [160 + w(5, 8), -64 + w(6, 8), 1], [114, -50],
    [144 + w(7, 7), -6 + w(8, 7), 1], [104, 2],

  ] : [
    [-36, -88], [-30, -116], [-2, -138], [42, -144],
    [100 + w(1, 4), -150 + w(2, 5), 1], [90, -122],
    [130 + w(3, 5), -96 + w(4, 6), 1], [106, -74],

    [70, -20], [56, -26], [52, 6, 1], [46, -44], [26, -84], [0, -100], [-20, -98],

  celFill(ctx, mass, P.hair, P.hairS, -10, -16);
  ctx.save(); ctx.clip(mass);
  // soft sheen band + strand highlights following the flow toward the back
  ctx.strokeStyle = css(P.hairH, 0.85); ctx.lineCap = 'round';

  }
  ctx.restore();
  ink(ctx, mass, P.line, lw);
  const sl = new Path2D();
  sl.moveTo(96, -134); sl.quadraticCurveTo(60, -130, 30, -118);

  ] : [

    [[6, -128], [40, -118], [-34 + w(13, 4), -40 + w(14, 4)], 11, 5],
    [[34, -116], [62, -96], [8 + w(15, 4), -44 + w(16, 3)], 10, 4],
    [[58, -100], [80, -70], [52 + w(17, 3), -34 + w(18, 3)], 8, 3],

  for (const [a, b, tip, bu, be] of front) { const p = clump(a, b, tip, bu, be); celFill(ctx, p, P.hair, P.hairS, -4, -10); ink(ctx, p, P.line, lw); }
  // shadow the fringe casts on the forehead
}

/* ===================== profile / front / back heads (same units as drawHeadQ) ===================== */

  if (op > 0.15) {

  if (o.mole) fillP(ctx, ellPath(30, 18, 2.6, 2.6), scl(P.line, 1.3));

  const mass = crPath(!old ? [

    [-118 + w(7, 6), 18 + w(8, 6), 1], [-70, 18], [-52, -10], [-30, -22], [-20, -16], [-12, -40], [10, -76],
  ] : [
    [20, -124], [-10, -146], [-56, -140],
    [-110 + w(1, 6), -132 + w(2, 6), 1], [-88, -108],
    [-124 + w(3, 6), -70 + w(4, 6), 1], [-96, -50],
    [-118 + w(5, 5), -8 + w(6, 5), 1], [-74, 10], [-56, -12], [-30, -22], [-20, -16], [-20, -60], [-4, -100],
  ]);
  celFill(ctx, mass, P.hair, P.hairS, 6, -14);
  ctx.save(); ctx.clip(mass); ctx.strokeStyle = css(P.hairH, 0.85); ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { ctx.lineWidth = lw * 1.2; ctx.beginPath(); ctx.moveTo(20 - i * 8, -126 + i * 12); ctx.quadraticCurveTo(-40, -150 + i * 14, -100, -112 + i * 16); ctx.stroke(); }

/* ===================== backgrounds: Seoul alley (intact / ruined) ===================== */

    glow(x, la[0], la[1] + 8, 50, [255, 240, 200], 0.7);

function drawBuilding(x, s, ruined, nightT, haze, reflections) {
  const r = RNG(s.seed);

function catenary(a, b, sag, n = 28) {

    pts.push(aP(X, Y, Z));

  return pts;
}

    else { ctx.fillStyle = css([255, 214, 120]); ctx.beginPath(); for (let i = 0; i < 20; i++) { const a = (i / 20) * TAU, rr = i % 2 ? 18 : 23; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.strokeStyle = css(line); ctx.lineWidth = 2; ctx.stroke(); fillP(ctx, ellPath(0, 0, 6, 6), [150, 100, 44]); }

  }
  ctx.strokeStyle = css(line); ctx.lineWidth = 2.6; ctx.stroke(str);
  ctx.restore();
}

  glow(x, 960, (a0[1] + a1[1]) / 2, 400, [255, 210, 140], 0.5);

  x.save(); x.clip(ce); vfill(x, 0, 0, W, PAL3.HZ, [[0, [60, 36, 24]], [1, [150, 104, 52]]]); x.restore();

    x.save(); x.clip(wl);

    // relief panels: photos & letters in gilded frames
    for (let z = 3; z < Zf; z += 2.2) for (let y = 1.2; y < 11; y += 2.6) {
      const q = polyPath([pP(sx * 11, y, z), pP(sx * 11, y + 1.8, z), pP(sx * 11, y + 1.8, z + 1.5), pP(sx * 11, y, z + 1.5)]);

      fillP(x, ins, mix([170, 120, 60], [246, 214, 150], hash2(z * 7, y * 3)), 0.9);

    x.save(); x.clip(bm);

    for (let i = 0; i < 40; i++) { const u = i / 40; const bx = lerp(p0[0], p1[0], u); x.fillStyle = css([[200, 50, 40], [240, 200, 90], [60, 90, 170], [240, 240, 220]][i % 4]); x.beginPath(); x.ellipse(bx, p0[1], (p1[0] - p0[0]) / 100, hh * 0.3, 0, 0, TAU); x.fill(); }

  x.save(); x.clip(fl);
  vfill(x, 0, PAL3.HZ, W, H - PAL3.HZ, [[0, [200, 160, 100]], [1, [90, 60, 36]]]);

  FX.creak(M, 38.3, 1.8, 0.45); FX.rumble(M, 38.3, 2.6, 0.5, { f: 70 });
  await step(0.58);

  /* D: 41-56 the palace waltz in D major */
  const bD = 1.875;
  melody(TH1, 41.0, bD, (t, m, d) => { INST.flute(M, t, toMajor(m), 0.85, d * 0.92); INST.pad(M, t, toMajor(m) - 12, 0.16, d, { att: 0.08, rel: 0.4, cut: 2400 }); }, 0, 8);
  PROG_MAJ.forEach((c, b) => {
    const t = 41.0 + b * bD, [bass, tones] = CH[c], beat = bD / 3;
    pn(t, bass + 12, 0.55, beat * 0.9); INST.pad(M, t, bass, 0.25, beat * 0.6, { att: 0.01, rel: 0.2, cut: 600, voices: 2 });
    for (const k of [1, 2]) tones.forEach((m) => { pn(t + k * beat, m, 0.3, beat * 0.5); INST.pad(M, t + k * beat, m, 0.1, beat * 0.45, { att: 0.02, rel: 0.15, cut: 2000 }); });
    if (b >= 4) INST.bell(M, t, tones[2] + 12, 0.35, { pan: 0.3 });
  });
  // applause: natural, many hands
  for (let i = 0; i < 520; i++) { const t = 41.0 + hash1(i * 13 + 1) * 6.4; const fade = 1 - inv(45.5, 47.6, t); FX.clap(M, t, (0.06 + hash1(i * 5) * 0.06) * Math.min(1, (t - 40.9) * 3) * fade, hash1(i * 17) * 1.8 - 0.9, i); }
  INST.bell(M, 52.6, 86, 0.6, { pan: -0.2 }); INST.bell(M, 52.6, 90, 0.4, { pan: 0.1 }); INST.bell(M, 52.62, 93, 0.35, { pan: 0.25 }); FX.shing(M, 52.6, 0.25);
  await step(0.7);

  /* E: 56-62 the mechanical repetition */
  for (let k = 1; k < 12; k += 2) { const t = 56 + k * 0.25; for (let j = 0; j < 30; j++) FX.clap(M, t, 0.07, (j / 15) - 1, 7); }
  const bE = [1.875, 2.15, 2.6];
  melody(TH1, 56.0, bE, (t, m, d, b) => mb(t, toMajor(m) + 12, 0.8, { cents: (hash1(Math.floor(t * 100)) - 0.5) * 50 * (1 + b) }), 0, 3);
  for (const [m, g] of [[38, 0.25], [39, 0.2], [45, 0.2]]) INST.pad(M, 56.5, m, g, 5.3, { att: 3, rel: 1, cut: 700, det: 18 });
  INST.pad(M, 59.0, 86, 0.12, 3.0, { att: 1.2, rel: 0.6, cut: 5000, det: 30, vib: 0.02, vibF: 11 }); INST.pad(M, 59.0, 87, 0.1, 3.0, { att: 1.2, rel: 0.6, cut: 5000, det: 30, vib: 0.02, vibF: 12 });
  for (const t of [59.4, 60.2, 61.0, 61.8]) FX.thump(M, t, 0.4, { f: 55 });
  FX.burst(M, 60.95, 0.08, { type: 'hp', f: 3000, q: 0.8, decay: 60, g: 0.35 });
  for (let i = 0; i < 6; i++) FX.burst(M, 61.0 + i * 0.1, 0.03, { type: 'hp', f: 4000, q: 0.8, decay: 120, g: 0.15 });
  await step(0.78);

  /* F: 62-68 the wall cracks, memories spill out */
  FX.burst(M, 62.2, 0.5, { type: 'hp', f: 1500, q: 0.6, decay: 9, g: 0.9, rev: 0.6 }); FX.thump(M, 62.2, 1.0, { f: 45, rev: 0.6 });
  for (let i = 0; i < 9; i++) FX.burst(M, 62.3 + i * 0.08 + hash1(i) * 0.05, 0.12, { type: 'hp', f: 2000 + hash1(i * 3) * 2000, q: 0.7, decay: 30, g: 0.3, pan: hash1(i * 5) - 0.5 });
  FX.rumble(M, 62.2, 4.5, 0.9, { f: 80, decay: 1.5, shape: 6 });
  for (let i = 0; i < 26; i++) {
    const h = (k) => hash3(i, 99, k);
    const t0 = 1.3 + h(1) * 3.2, sy = 200 + h(2) * 600, g = 900, land = 900 + h(5) * 120;
    const t = 62 + t0 + Math.sqrt((2 * (land - sy)) / g), kind = Math.floor(h(6) * 4), pan = clamp(h(3) - 0.5);
    if (kind === 2) INST.bell(M, t, 84 + Math.floor(h(7) * 8), 0.18, { pan });
    else if (kind === 3) mb(t, 81 + Math.floor(h(7) * 6), 0.6, { pan });
    else FX.burst(M, t, 0.08, { f: 1800, q: 0.5, decay: 50, g: 0.12, pan });
  }
  [76, 81, 74, 77].forEach((m, i) => mb(65.2 + i * 0.9, m + 12, 0.55, { cents: i === 2 ? -45 : 0 }));
  await step(0.84);

  /* G: 68-73 solo piano, slow */
  melody(TH1, 68.0, 2.5, (t, m, d) => pn(t, m, 0.5, d, { sus: 1.6, rev: 0.45 }), 0, 2);
  [['Dm', 68.0], ['Bb', 70.5]].forEach(([c, t]) => { const [bass, tones] = CH[c]; pn(t, bass + 12, 0.35, 2.4, { sus: 1.6 }); tones.forEach((m, k) => pn(t + 0.12 * (k + 1), m - 12, 0.22, 2.2, { sus: 1.6 })); });

  /* H: 73-81 the last dance */
  const bH = [2.0, 2.2, 2.4, 1.4];
  melody(TH2, 73.0, bH, (t, m, d) => pn(t, m, 0.55, Math.min(d, 2.5), { sus: 1.5, rev: 0.5 }), 0, 4);
  [['Dm', 73.0], ['Bb', 75.0], ['Bb', 77.2], ['F', 79.6]].forEach(([c, t], b) => { const [bass, tones] = CH[c]; pn(t, bass + 12, 0.4, 2, { sus: 1.4 }); tones.forEach((m) => pn(t + bH[b] / 3, m - 12, 0.2, 0.6)); tones.forEach((m) => pn(t + 2 * bH[b] / 3, m - 12, 0.18, 0.6)); });
  INST.pad(M, 73.0, 74, 0.16, 7.5, { att: 2, rel: 2.5, cut: 2600, det: 9 }); INST.pad(M, 73.0, 81, 0.12, 7.5, { att: 2.5, rel: 2.5, cut: 3000, det: 9 });
  for (let i = 0; i < 110; i++) { const t = 74.3 + hash1(i * 3 + 9) * 5; INST.bell(M, t, 96 + Math.floor(hash1(i * 7) * 12), 0.035, { pan: hash1(i) * 2 - 1, rev: 0.7 }); }
  INST.bell(M, 80.2, 79, 0.35, { pan: -0.2, rev: 0.9 }); INST.bell(M, 80.45, 79, 0.15, { pan: -0.3, rev: 0.9 });
  await step(0.9);

  /* I-J: 81-91 emptiness, the walk away, the music box winds down */
  INST.pad(M, 81.0, 38, 0.3, 3.4, { att: 1.5, rel: 1.5, cut: 500, voices: 2 });
  for (let i = 0; i < 18; i++) INST.bell(M, 81.2 + hash1(i * 11) * 3, 98 + Math.floor(hash1(i * 13) * 8), 0.03 * (1 - i / 18), { pan: 0.4, rev: 0.8 });
  for (let k = 1; k < 7; k++) { const t = 85 + k * 0.8333; if (t < 90.5) FX.thump(M, t, 0.22 * (1 - k * 0.11), { f: 110, rev: 0.4 }); FX.burst(M, t + 0.01, 0.08, { f: 900, q: 0.6, decay: 40, g: 0.06 * (1 - k * 0.1) }); }
  let tw = 86.0, slow = 1;
  for (const [m, beats] of [[69, 1], [74, 1], [76, 1], [77, 2], [76, 1], [74, 1]]) { if (tw > 89.6) break; mb(tw, m + 12 - (slow - 1) * 0.6, 0.7 / slow, { cents: -(slow - 1) * 60, rev: 0.5 }); tw += beats * 0.85 * slow; slow *= 1.22; }
  await step(0.95);

  freeverb(M);
  // master: fades, soft clip, normalise to -1 dBFS peak
  let peak = 0;
  for (let i = 0; i < NS; i++) {
    const t = i / SR, g = Math.min(1, t / 1.2) * Math.min(1, (DUR - t) / 2.0);
    M.L[i] = Math.tanh(M.L[i] * g * 1.1); M.R[i] = Math.tanh(M.R[i] * g * 1.1);
    peak = Math.max(peak, Math.abs(M.L[i]), Math.abs(M.R[i]));
  }
  const k = peak > 0 ? 0.89 / peak : 1;
  let hsh = 2166136261 >>> 0;
  for (let i = 0; i < NS; i++) { M.L[i] *= k; M.R[i] *= k; if ((i & 15) === 0) { hsh = Math.imul(hsh ^ ((M.L[i] * 32767) | 0), 16777619) >>> 0; hsh = Math.imul(hsh ^ ((M.R[i] * 32767) | 0), 16777619) >>> 0; } }
  await step(1);
  return { L: M.L, R: M.R, hash: hsh.toString(16) };
}

/* ===================== main / player ===================== */
const DWW = { ready: false, audioReady: false };
window.DWW = DWW;
(function () {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const playBtn = document.getElementById('play'), loadBar = document.querySelector('#load > i'), loadBox = document.getElementById('load');
  const prog = document.querySelector('#bar > i'), bar = document.getElementById('bar');
  const test = /[?&]test=1/.test(location.search);
  function buildAssets() {
    initPost();
    BG.alley = buildAlley(false);
    BG.ruin = buildAlley(true);
    BG.skyFace = buildSkyClose([1460, 230], 64, 1301);
    BG.skyMoon = buildSkyClose([980, 470], 190, 1302);
    BG.kitchen = buildKitchen();
    BG.tent = buildTentStreet();
    BG.musicbox = buildMusicBoxBG();
    BG.goldsky = buildGoldSky();
    BG.gates = buildGatesBG();
    BG.palace = buildPalace();
    BG.bokeh = buildBokehStrip();
    BG.crackwall = buildCrackWall();
    buildGuestSprites();
  }
  let lastF = -1;
  function render(f) {
    f = Math.max(0, Math.min(NF - 1, f | 0));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    renderFrame(ctx, f);
    postFX(ctx, f);
    lastF = f;
  }
  DWW.render = render;
  DWW.debug = function (name, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    DEBUG[name](ctx, t || 0);
  };
  DWW.frameHash = function (f) {
    render(f);
    const d = ctx.getImageData(0, 0, W, H).data; let h = 2166136261 >>> 0;
    for (let i = 0; i < d.length; i += 7) h = Math.imul(h ^ d[i], 16777619) >>> 0;
    return h.toString(16);
  };

  /* ---------- playback ---------- */
  let actx = null, abuf = null, src = null, playing = false, startAt = 0, offset = 0, audioData = null;
  const now = () => (playing ? actx.currentTime - startAt + offset : offset);
  function startSource() {
    src = actx.createBufferSource(); src.buffer = abuf; src.connect(actx.destination);
    startAt = actx.currentTime + 0.05; src.start(startAt, offset);
    src.onended = () => { if (playing && now() >= DUR - 0.05) { playing = false; offset = 0; playBtn.style.display = 'block'; } };
  }
  function play() {
    if (!DWW.audioReady) return;
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
      abuf = actx.createBuffer(2, NS, SR); abuf.getChannelData(0).set(audioData.L); abuf.getChannelData(1).set(audioData.R);
    }
    if (actx.state === 'suspended') actx.resume();
    if (offset >= DUR - 0.05) offset = 0;
    playing = true; startSource(); playBtn.style.display = 'none';
  }
  function pause() { if (!playing) return; offset = now(); playing = false; try { src.stop(); } catch (e) {} playBtn.style.display = 'block'; }
  function seek(t) { const was = playing; if (was) { try { src.onended = null; src.stop(); } catch (e) {} playing = false; } offset = clamp(t, 0, DUR - 0.01); if (was) { playing = true; startSource(); } else render(Math.floor(offset * FPS)); }
  DWW.play = play; DWW.pause = pause; DWW.seek = seek;
  function tick() {
    const t = now(), f = Math.min(NF - 1, Math.floor(t * FPS));
    if (f !== lastF) render(f);
    prog.style.width = ((t / DUR) * 100).toFixed(3) + '%';
    requestAnimationFrame(tick);
  }
  playBtn.addEventListener('click', (e) => { e.stopPropagation(); play(); });
  cv.addEventListener('click', () => { if (!DWW.audioReady) return; playing ? pause() : play(); });
  bar.addEventListener('click', (e) => { const r = bar.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * DUR); });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') seek(now() + 5);
    else if (e.key === 'ArrowLeft') seek(now() - 5);
    else if (e.key === 'Home') seek(0);
    else if (e.key === 'f') { const st = document.getElementById('stage'); if (!document.fullscreenElement) st.requestFullscreen && st.requestFullscreen(); else document.exitFullscreen(); }
  });

  /* ---------- export helpers (used by the offline renderer) ---------- */
  DWW.audioChunk = function (ch, start, len) {
    const a = ch === 0 ? audioData.L : audioData.R, n = Math.min(len, NS - start), out = new Int16Array(n);
    for (let i = 0; i < n; i++) out[i] = Math.max(-32767, Math.min(32767, Math.round(a[start + i] * 32767)));
    let s = ''; const u8 = new Uint8Array(out.buffer);
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  };

  buildAssets();
  DWW.ready = true;
  render(Math.floor(8.6 * FPS));
  const t0 = performance.now();
  synthesize((p) => { loadBar.style.width = (p * 100).toFixed(0) + '%'; }).then((a) => {
    audioData = a; DWW.audioHash = a.hash; DWW.audioMs = Math.round(performance.now() - t0);
    DWW.audioReady = true; loadBox.style.display = 'none'; playBtn.style.display = 'block';
    render(Math.floor(8.6 * FPS));
    if (!test) requestAnimationFrame(tick);
  });
})();
