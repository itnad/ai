# newai 안전 정책. 이 파일은 사람만 고친다(에이전트의 수정 시도는 사람 승인).
# 판정 단계
#   allow : 즉시 허용
#   wait  : 결정 카드를 띄우고 대기 시간을 반드시 채운 뒤, 1순위가 자동 선택 가능하면 진행
#   human : 사람이 고를 때까지 기다림
#   deny  : 거부
# Bash 명령은 맞는 규칙을 모두 찾고 그중 가장 엄격한 단계를 쓴다.
# 정규식 앞의 (?i)는 대소문자 무시. except_local: true면 명령 안의 주소가 모두 이 PC 안일 때 규칙을 건너뛴다.
version: 1

protected_paths:            # 쓰기는 files.write_protected 단계
  - ${INSTALL_DIR}
  - ${NEWAI_HOME}/policy.yaml
  - ${NEWAI_HOME}/roles.yaml
  - ${NEWAI_HOME}/bin
  - ${NEWAI_HOME}/config.yaml
  - ${NEWAI_HOME}/secrets.yaml
  - ${NEWAI_HOME}/pipelines
  - ${NEWAI_HOME}/newai.db

secret_files: [".env", ".env.*", "*.pem", "*.key", "*.pfx", "*.p12", "id_rsa*", "id_ed25519*", "id_ecdsa*", "credentials*.json", ".npmrc", ".pypirc", ".netrc", "secrets.yaml"]
secret_files_exclude: [".env.example", ".env.sample", ".env.template", "*.pub"]

bash:
  - { level: deny,  match: '\bgit\s+((-C|-c|--git-dir|--work-tree|--namespace)(\s+|=)\S+\s+|-\S+\s+)*push\b', reason: 'push는 릴리스 단계에서 사람이 합니다' }
  - { level: deny,  match: '\bgh\s+(pr\s+(create|merge)|release\s+create|repo\s+create)\b', reason: 'PR·릴리스·원격 저장소 생성은 사람이 합니다' }
  - { level: deny,  match: '\b(npm|pnpm|yarn)\s+publish\b|\bvercel\b.*(--prod|\bdeploy\b)|\b(firebase|netlify|fly|wrangler)\s+deploy\b|\bkubectl\s+(apply|delete)\b|\bterraform\s+(apply|destroy)\b|\bdocker\s+push\b', reason: '배포·공개는 사람이 합니다' }
  - { level: human, match: '\bgit\s+(reset\s+--hard|clean\s+-\w*[fdx]|filter-branch|filter-repo|rebase|branch\s+-D|reflog\s+expire|update-ref\s+-d|checkout\s+--\s+\.|restore\s+--staged\s+--worktree)\b', reason: '이력 파괴 위험' }
  - { level: human, match: '\brm\s+-[a-zA-Z]*[rR][a-zA-Z]*\s+(\S+\s+)*(/|~|\$HOME|\.\.|\*|[A-Za-z]:[\\/])', reason: '넓은 범위 삭제' }
  - { level: human, match: '\bfind\b.*\s-delete\b|(?i)\bRemove-Item\b.*-Recurse|\brmdir\s+/s\b|\bdel\s+/s\b', reason: '대량 삭제' }
  - { level: human, match: '(?i)\b(drop\s+(table|database|schema)|truncate\s+table|dropdb|migrate\s+reset|db\s+reset|flushall)\b', reason: 'DB 파괴 위험' }
  - { level: human, match: '(?i)\bdelete\s+from\s+[\w."`]+\s*(;|"|''|$)', reason: '조건 없는 DELETE' }
  - { level: human, match: '(?i)\b(setx|reg\s+(add|delete)|schtasks|crontab|systemctl\s+(--user\s+)?(enable|disable)|launchctl)\b', reason: '시스템·전역 설정 변경' }
  - { level: wait,  match: '(?i)(^|[\s;&|(`])(curl|wget|Invoke-WebRequest|Invoke-RestMethod|iwr|irm)(?=\s|$)', reason: '외부 통신', except_local: true }
  - { level: wait,  match: '(^|[\s;&|(`])(ssh|scp|sftp|rsync|ftp|nc|ncat|telnet)(?=\s|$)', reason: '외부 통신' }
  - { level: wait,  match: '\b(npm|pnpm|yarn|bun)\s+(install|i|add|ci)\b|\bnpx\b|\bpip3?\s+install\b|\buv\s+(pip|add)\b|\bcargo\s+(install|add)\b|\bgo\s+(get|install)\b', reason: '패키지 내려받기(외부 통신)' }
  - { level: wait,  match: '\bgit\s+(clone|fetch|pull|submodule\s+update)\b', reason: '원격 저장소 통신' }

files:
  write_outside_workdir: wait
  write_protected: human
  write_secret_file: human
  read_secret_file: human

web:
  local_hosts: allow        # localhost, 127.0.0.1, ::1
  other: wait               # WebFetch, WebSearch, 외부 주소 check-web

auto_select_exclude: [push, deploy, publish, release, "푸시", "배포", "공개", "릴리스"]
